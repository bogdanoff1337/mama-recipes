<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вичитка рецептів</title>
<style>
:root{--bg:#f4f0e8;--surface:#fffdf9;--ink:#29251f;--muted:#766f63;--line:#ded5c7;--accent:#9c542c;--accent-soft:#f8e5cf;--success:#296244;--danger:#a83f35;--photo:#25211d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);background:var(--surface)}h1{font-size:17px;margin:0;white-space:nowrap}.progress{height:8px;max-width:360px;flex:1;background:#e7dfd3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--success);transition:width .2s}.count{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}main{display:grid;grid-template-columns:250px minmax(320px,1fr) minmax(430px,1.15fr);height:calc(100vh - 64px)}nav{overflow:auto;border-right:1px solid var(--line);background:#faf7f1;padding:14px 10px}.group{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;margin:14px 8px 5px;text-transform:uppercase}.group:first-child{margin-top:2px}.recipe{width:100%;text-align:left;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;padding:8px;cursor:pointer}.recipe:hover{background:#f1e9dd}.recipe.active{background:var(--accent-soft);color:#703313}.recipe small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.photo{position:relative;display:grid;place-items:center;overflow:hidden;background:var(--photo)}.photo img{max-height:100%;max-width:100%;object-fit:contain}.photo .missing{color:#d6cfc5;text-align:center;padding:30px}.text{overflow:auto;background:var(--surface);padding:28px 32px 70px}.text h2{font-size:23px;line-height:1.2;margin:0}.meta{margin:6px 0 24px;color:var(--muted);font-size:13px}.line{min-height:27px;white-space:pre-wrap;font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;padding:1px 8px;border-radius:5px}.line.q{background:#fff3d9;margin:4px 0;padding:7px 8px;border-left:3px solid var(--accent)}textarea{display:block;resize:vertical;width:100%;min-height:40px;border:1px solid #d8b786;border-radius:5px;background:#fffdf7;color:var(--ink);font:inherit;line-height:1.6;padding:5px 7px;outline:none}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #f5dfc1}.tools{display:flex;align-items:center;gap:7px;margin-top:6px}.hint{font-size:12px;color:var(--muted);margin-right:auto}.tools button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:5px;padding:3px 7px;cursor:pointer}.tools button:hover{border-color:var(--accent)}.saved{color:var(--success);font-size:12px}.error{color:var(--danger);font-size:12px}.empty{padding:44px;color:var(--muted);text-align:center}@media(max-width:900px){header{padding:0 14px}main{grid-template-columns:190px 1fr;grid-template-rows:44vh auto;height:auto;min-height:calc(100vh - 64px)}.photo{grid-column:1/3}.text{padding:20px}.line{font-size:13px}}@media(max-width:620px){main{display:block}nav{max-height:180px}.photo{height:42vh}.text{min-height:55vh}}
</style>
</head>
<body>
<header><h1>Вичитка рецептів</h1><div class="progress"><i id="bar"></i></div><span class="count" id="count"></span></header>
<main><nav id="nav"></nav><section class="photo" id="photo"></section><article class="text" id="text"></article></main>
<script>
let recipes=[],index=0;const $=id=>document.getElementById(id);const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function load(){const data=await fetch('/api/recipes').then(r=>r.json());recipes=data.recipes;if(index>=recipes.length)index=Math.max(0,recipes.length-1);render()}
function render(){const total=recipes.reduce((sum,recipe)=>sum+recipe.body.reduce((n,line)=>n+(line.questions?.length||0),0),0),complete=recipes.filter(recipe=>recipe.body.every(line=>!line.questions?.length)).length;$('count').textContent=`${recipes.length} рецептів · ${total} відкритих фрагм.`;$('bar').style.width=recipes.length?`${100*complete/recipes.length}%`:'0%';let category='';$('nav').innerHTML=recipes.map((recipe,i)=>{const head=recipe.category!==category?(category=recipe.category,`<div class="group">${esc(category)}</div>`):'';const questions=recipe.body.reduce((n,line)=>n+(line.questions?.length||0),0);return `${head}<button class="recipe ${i===index?'active':''}" data-index="${i}">${esc(recipe.id)}. ${esc(recipe.title)}<small>${questions?`${questions} фрагм.`:'перевірено'}</small></button>`}).join('')||'<div class="empty">Рецептів немає.</div>';$('nav').querySelectorAll('[data-index]').forEach(button=>button.onclick=()=>{index=+button.dataset.index;render()});const recipe=recipes[index];if(!recipe){$('photo').innerHTML='';$('text').innerHTML='<div class="empty">Рецептів немає.</div>';return}$('photo').innerHTML=recipe.images[0]?`<img src="/photos/${encodeURIComponent(recipe.images[0])}" alt="Фото рецепта" onerror="this.outerHTML='<div class=missing>Фото не знайдено</div>'">`:'<div class="missing">Для цього рецепта немає фото</div>';$('text').innerHTML=`<h2>${esc(recipe.id)}. ${esc(recipe.title)}</h2><div class="meta">${esc(recipe.file)} · зміни зберігаються одразу</div>${recipe.body.map(line=>line.questions?.length?questionLine(line):`<div class="line">${esc(line.text)||' '}</div>`).join('')}`}
function showLine(question){return question.original.replace(/<!--\s*\?\?(.*?)-->/g,(_,hint)=>`[${hint.trim()||'?'}]`)}
function questionLine(line){const question=line.questions[0],value=showLine(question);return `<div class="line q"><textarea data-qid="${question.qid}" aria-label="${question.qid}">${esc(value)}</textarea><div class="tools"><span class="hint">${esc(question.qid)} · змініть текст у [дужках] або весь рядок</span><button data-answer="ОК">ОК</button><button data-answer="НЕ ВДАЛОСЯ ПРОЧИТАТИ">Не прочитати</button><button data-answer="ВИДАЛИТИ">Видалити</button><span class="saved"></span></div></div>`}
async function save(qid,value,status){status.textContent='Збереження…';status.className='saved';try{const response=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qid,value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Не вдалося зберегти');status.textContent='Збережено';if(data.saved){recipes=data.recipes;render()}}catch(error){status.textContent=error.message;status.className='error'}}
$('text').addEventListener('blur',event=>{if(event.target.matches('textarea')){const status=event.target.closest('.q').querySelector('.saved');save(event.target.dataset.qid,event.target.value,status)}},true);$('text').addEventListener('keydown',event=>{if(event.target.matches('textarea')&&event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();event.target.blur()}});$('text').addEventListener('click',event=>{const button=event.target.closest('[data-answer]');if(!button)return;const area=button.closest('.q').querySelector('textarea');area.value=button.dataset.answer;area.blur()});load();
</script>
</body>
</html>
